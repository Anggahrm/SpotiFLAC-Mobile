version: '3.8'

services:
  spotiflac-bot:
    build:
      context: ..
      dockerfile: telegram_bot/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_PORT=8080
      - DOWNLOAD_DIR=/tmp/spotiflac_downloads
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - DEBUG=${DEBUG:-false}
    volumes:
      - downloads:/tmp/spotiflac_downloads
    restart: unless-stopped

volumes:
  downloads:
